case_id: "case_20_asap_sate"
title: "Pengaturan Arus Evakuasi: Asap Tebal Pembakaran Sate di Persimpangan"
description: "Skenario N=5 berbasis Graph Coloring / Conflict Scheduling. Kepulan asap tebal pembakaran sate di persimpangan lorong mengganggu visibilitas, menuntut alokasi slot waktu (color/time-slot) agar gelombang evakuasi melintas secara bertahap."

nodes:
  - id: 0
    label: "Titik Kumpul Lobi Kantin (Start)"
    pos: [0.0, 0.0]
  - id: 1
    label: "Persimpangan Asap Sate A"
    pos: [5.0, 5.0]
  - id: 2
    label: "Persimpangan Asap Sate B"
    pos: [5.0, -5.0]
  - id: 3
    label: "Simpul Koridor Luar"
    pos: [10.0, 0.0]
  - id: 4
    label: "Zona Aman Halaman Terbuka (Goal)"
    pos: [15.0, 0.0]

edges:
  - from: 0
    to: 1
    weight: 1.0
    capacity: 10.0
  - from: 0
    to: 2
    weight: 1.0
    capacity: 10.0
  - from: 1
    to: 2
    weight: 1.0
    capacity: 5.0
  - from: 1
    to: 3
    weight: 1.0
    capacity: 10.0
  - from: 2
    to: 3
    weight: 1.0
    capacity: 10.0
  - from: 3
    to: 4
    weight: 1.0
    capacity: 15.0

execution_plan:
  start_node: 0
  goal_node: 4
  events:
    - step: 1
      type: "CONFLICT_NODE_TRIGGER"
      target_node: 1
      description: "Kepulan asap sate tebal menutup visibilitas di Persimpangan A (Node 1)! Membutuhkan penjadwalan alokasi time-slot (coloring) agar pejalan kaki melintas bergantian secara aman."
