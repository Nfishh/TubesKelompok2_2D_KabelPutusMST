case_id: "case_09_kebocoran_gas"
title: "Jaringan Sensor Darurat: Kebocoran Tabung Gas Elpiji Kompleks"
description: "Skenario N=5 berbasis Minimum Spanning Tree (MST). Kebocoran gas elpiji di area dapur utama mengharuskan pengikatan jaringan sensor deteksi gas darurat antar pos pantau dengan panjang kabel/jarak komunikasi minimum."

nodes:
  - id: 0
    label: "Panel Monitoring Pusat (Master Gateway)"
    pos: [0.0, 0.0]
  - id: 1
    label: "Pos Sensor Dapur Utama"
    pos: [6.0, 5.0]
  - id: 2
    label: "Pos Sensor Gudang Tabung"
    pos: [6.0, -5.0]
  - id: 3
    label: "Pos Sensor Kantin Belakang"
    pos: [12.0, 0.0]
  - id: 4
    label: "Pos Sensor Area Evakuasi Luar (Goal Node)"
    pos: [18.0, 0.0]

edges:
  - from: 0
    to: 1
    weight: 8.0
    capacity: 10.0
  - from: 0
    to: 2
    weight: 10.0
    capacity: 10.0
  - from: 1
    to: 2
    weight: 4.0
    capacity: 5.0
  - from: 1
    to: 3
    weight: 6.0
    capacity: 8.0
  - from: 2
    to: 3
    weight: 5.0
    capacity: 8.0
  - from: 3
    to: 4
    weight: 7.0
    capacity: 12.0

execution_plan:
  start_node: 0
  goal_node: 4
  events:
    - step: 1
      type: "DYNAMIC_EDGE_WEIGHT"
      target_edge: [0, 1]
      new_weight: 50.0
      description: "Kebocoran Gas Elpiji tebal merusak jalur kabel utama (Edge 0 -> 1), algoritma MST harus mencari topologi pohon jaringan minimum baru!"
