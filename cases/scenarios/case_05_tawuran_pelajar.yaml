case_id: "case_05_tawuran_pelajar"
title: "Pengaturan Arus Evakuasi: Konflik Tawuran Pelajar di Simpul Pertigaan"
description: "Skenario N=5 berbasis Graph Coloring / Conflict Scheduling. Tawuran kelompok pelajar pecah di simpul pertigaan utama, menuntut pengalokasian slot waktu (color/time-slot) yang terpisah agar arus warga tidak bertabrakan dengan area konflik."

nodes:
